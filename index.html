function useW(){
  const [w,setW]=useState(()=>window.innerWidth);
  useEffect(()=>{const fn=()=>setW(window.innerWidth);window.addEventListener("resize",fn);return()=>window.removeEventListener("resize",fn);},[]);
  return w;
}

/* ── URL CONVERTERS ── */
function extractDriveId(url){
  if(!url)return null;
  for(const p of[/\/file\/d\/([a-zA-Z0-9_-]{20,})/,/id=([a-zA-Z0-9_-]{20,})/,/\/d\/([a-zA-Z0-9_-]{20,})\//]){
    const m=url.match(p);if(m)return m[1];
  }
  return null;
}
function toImgUrl(url){
  if(!url)return'';
  if(!url.includes('drive.google.com'))return url;
  const id=extractDriveId(url);
  return id?`https://lh3.googleusercontent.com/d/${id}`:url;
}
function toBrochureUrls(url){
  if(!url)return{open:null,download:null};
  if(!url.includes('drive.google.com'))return{open:url,download:url};
  const id=extractDriveId(url);
  if(id)return{open:`https://drive.google.com/file/d/${id}/preview`,download:`https://drive.google.com/uc?export=download&id=${id}`};
  return{open:url,download:url};
}

/* ── EXPORT (Save & Publish) ── */
function exportWebsite(currentData){
  try{
    const json=JSON.stringify(currentData,null,2).replace(/<\/script>/gi,'<\\/script>');
    const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    const updated=html.replace(
      /\/\*__DATA_START__\*\/[\s\S]*?\/\*__DATA_END__\*\//,
      `/*__DATA_START__*/\nconst DEF=${json};\n/*__DATA_END__*/`
    );
    if(updated===html){alert("Export error — markers not found.");return;}
    const blob=new Blob([updated],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='gunjal-website-final.html';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    alert('✅ Website downloaded!\n\nUpload this file to GitHub to publish changes for everyone.');
  }catch(e){alert('Export failed: '+e.message);}
}

/* ── SAFE IMAGE ── */
function SafeImg({src,alt,style}){
  const cv=toImgUrl(src);
  const [s,setS]=useState('idle');
  useEffect(()=>{setS(cv?'loading':'idle');},[cv]);
  if(!cv||s==='error'){
    return(
      <div style={{...style,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,background:"linear-gradient(135deg,#f0ebe0,#e8dfc8)",border:"1.5px dashed rgba(196,144,30,.4)"}}>
        <I.ImgPh/><span style={{fontSize:9.5,color:"#9A7A40",textAlign:"center",padding:"0 8px",lineHeight:1.4}}>{src?"Image not loading":"Add image via Admin"}</span>
      </div>
    );
  }
  return(
    <div style={{...style,position:"relative",overflow:"hidden"}}>
      {s!=='loaded'&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"#f0ebe0"}}><I.ImgPh/></div>}
      <img src={cv} alt={alt||""} style={{width:"100%",height:"100%",objectFit:"cover",display:"block",opacity:s==='loaded'?1:0,transition:"opacity .3s"}}
        draggable={false} onContextMenu={e=>e.preventDefault()}
        onLoad={()=>setS('loaded')} onError={()=>setS('error')}/>
    </div>
  );
}

/* ── IMAGE INPUT with live preview ── */
function ImgInput({value,onChange}){
  const cv=toImgUrl(value);
  const isDrive=value&&value.includes('drive.google.com');
  const [err,setErr]=useState(false);
  useEffect(()=>setErr(false),[value]);
  return(
    <div>
      <input className="ain" type="url" value={value} onChange={e=>{onChange(e.target.value);setErr(false);}} placeholder="Image URL or Google Drive share link"/>
      {isDrive&&!err&&<div style={{background:"#E8F5E9",border:"1px solid #A5D6A7",borderRadius:4,padding:"4px 9px",marginTop:5,fontSize:11,color:"#2E7D32"}}>✓ Google Drive — auto-converted!</div>}
      {cv&&<div style={{marginTop:6,borderRadius:4,overflow:"hidden",height:60,position:"relative",background:"#f0ebe0",border:"1px solid #eee"}}>
        <img src={cv} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}} onError={e=>{setErr(true);e.target.style.display="none";}} onLoad={e=>e.target.style.display="block"}/>
        {err&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10.5,color:"#C62828",background:"#FFF3F3"}}>⚠️ Cannot load — check Drive sharing</div>}
      </div>}
    </div>
  );
}

function DriveGuide({type}){
  return(
    <div style={{background:"#E3F2FD",border:"1px solid #90CAF9",borderRadius:6,padding:"9px 11px",marginBottom:11,fontSize:11,lineHeight:1.65,color:"#0D47A1"}}>
      <strong>📌 Google Drive {type==="pdf"?"PDF":"image"}:</strong> Open file → Share → <strong>Anyone with link</strong> → Viewer → Copy link → paste ✓
    </div>
  );
}

      {prod&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.82)",zIndex:9990,display:"flex",alignItems:"center",justifyContent:"center",padding:mob?8:16,overflowY:"auto"}} onClick={()=>setProd(null)}>
          <div style={{background:W,width:"100%",maxWidth:mob?"100%":960,maxHeight:mob?"96vh":"92vh",display:"flex",flexDirection:mob?"column":"row",position:"relative",overflow:mob?"auto":"hidden",boxShadow:"0 24px 64px rgba(0,0,0,.5)",borderRadius:mob?8:0,marginBlock:mob?"auto":0}} onClick={e=>e.stopPropagation()}>
            <div style={{width:mob?"100%":"40%",padding:mob?"20px 16px":"28px 24px",overflowY:mob?"visible":"auto",flexShrink:0,borderRight:mob?"none":"1px solid "+BD,borderBottom:mob?"1px solid "+BD:"none"}}>
              <div style={{fontSize:9.5,fontWeight:700,color:G,letterSpacing:2,textTransform:"uppercase"}}>Product Details</div>
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:mob?20:24,fontWeight:700,color:N,margin:"10px 0 8px",lineHeight:1.2}}>{prod.name}</h2>
              <span style={{display:"inline-block",background:prod.grade==="Food Grade"?"#E8F5E9":"rgba(11,29,58,.08)",color:prod.grade==="Food Grade"?"#1B5E20":N,fontSize:10.5,fontWeight:700,padding:"3px 10px",letterSpacing:.5,textTransform:"uppercase",marginBottom:16,border:"1px solid "+(prod.grade==="Food Grade"?"rgba(27,94,32,.3)":BD)}}>{prod.grade}</span>
              <div style={{marginBottom:16}}>
                {[["CAS Number",prod.cas],["Grade",prod.grade],["Availability","In Stock"],["Packaging","As Per Requirement"]].map(([l,v])=>(
                  <div key={l} style={{display:"flex",padding:"10px 0",borderBottom:"1px solid "+BD}}>
                    <span style={{fontSize:9.5,fontWeight:700,color:G,letterSpacing:1,textTransform:"uppercase",width:110,flexShrink:0,paddingTop:1}}>{l}</span>
                    <span style={{fontSize:mob?13:14,color:N}}>{v}</span>
                  </div>
                ))}
              </div>
              <p style={{fontSize:mob?13.5:14.5,color:"#6B7280",lineHeight:1.78,marginBottom:20}}>{prod.desc}</p>
              <button onClick={()=>{setProd(null);go("contact");}} style={{width:"100%",background:N,color:W,border:"none",padding:13,fontSize:13.5,fontWeight:700,cursor:"pointer",letterSpacing:.5,textTransform:"uppercase",marginBottom:9}}>Send Inquiry</button>
              <button onClick={()=>setProd(null)} style={{width:"100%",background:"transparent",color:"#9CA3AF",border:"1px solid "+BD,padding:11,fontSize:13,fontWeight:600,cursor:"pointer"}}>Close</button>
            </div>
            <div style={{flex:1,position:"relative",background:CR,minHeight:mob?220:440,height:mob?250:"auto"}}>
              <button onClick={()=>setProd(null)} style={{position:"absolute",top:10,right:10,background:"rgba(0,0,0,.58)",border:"none",color:W,width:36,height:36,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2}}><I.X/></button>
              <SafeImg src={prod.img} alt={prod.name} style={{width:"100%",height:"100%",display:"block"}}/>
              <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,.78))",padding:"18px 16px 14px"}}>
                <div style={{fontSize:mob?15:17,fontWeight:700,color:W}}>{prod.name}</div>
                <div style={{fontFamily:"monospace",fontSize:mob?10:11,color:"rgba(255,255,255,.6)",marginTop:3}}>CAS: {prod.cas}</div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ADMIN PANEL — outside App = no blinking */}
      {admin&&<AdminPanel data={data} setData={setData} setAdmin={setAdmin} mob={mob}/>}

    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
